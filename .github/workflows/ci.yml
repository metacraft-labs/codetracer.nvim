name: CI

on:
  push:
    branches: [dev, stable]
  pull_request:

# The jobs run `just` recipes inside the flake's dev shell, so a run is
# reproduced locally with `nix develop --command just <recipe>`.
#
# `just test-integration` is not run here: it drives a real CodeTracer pane
# server (`codetracer-tui`, built from the CodeTracer repository) over a real
# recording, neither of which this repository builds. It is the gate run
# locally before a change lands (see the Justfile for its variables).

jobs:
  lint:
    name: Lint (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, x64]
          - [self-hosted, linux, arm64]
          - [self-hosted, macos, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: metacraft-labs/metacraft-github-actions/assert-workflow-triggers@dev
        with:
          mainline: dev
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run linters
        run: nix develop --profile "$RUNNER_TEMP/codetracer-nvim-dev-shell" --command just lint

  test:
    name: Test (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, x64]
          - [self-hosted, linux, arm64]
          - [self-hosted, macos, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        run: nix develop --profile "$RUNNER_TEMP/codetracer-nvim-dev-shell" --command just test-unit

  build:
    name: Build (${{ join(matrix.runner, '-') }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, x64]
          - [self-hosted, linux, arm64]
          - [self-hosted, macos, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Modules load
        run: nix develop --profile "$RUNNER_TEMP/codetracer-nvim-dev-shell" --command just build
      - name: Nix package
        run: nix build --print-build-logs .#default
